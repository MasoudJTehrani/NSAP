[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgbench"
version = "0.1.0"
description = "Reproducible AI2-THOR scene-graph dataset/benchmark generator"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["ai2thor>=5.0.0", "numpy>=1.21", "pillow>=9.0"]

[tool.setuptools.packages.find]
include = ["sgbench*"]
